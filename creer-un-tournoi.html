<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem("tc_theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <title>Créer un tournoi · Tournechec</title>
  <meta name="description" content="Crée ton tournoi d'échecs : nom, description, dates, lieu, règlements et format.">
  <link rel="icon" type="image/svg+xml" href="media/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/bottom.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body data-page="creer-un-tournoi" data-auth="required">
  <div id="site-header"></div>

  <main class="section-tight">
    <div class="container section-head center">
      <span class="kicker">Organisateur</span>
      <h1>Créer un tournoi</h1>
      <p>Tu deviens automatiquement arbitre du tournoi que tu crées : tu pourras générer les tables et gérer la rencontre.</p>
    </div>

    <div class="container" style="max-width:760px;">
      <form id="create-form" class="card reveal visible" novalidate>
        <div class="field">
          <label for="c-name">Nom du tournoi *</label>
          <input type="text" id="c-name" name="name" required maxlength="120" placeholder="Ex. : Tournoi hivernal de l'école">
        </div>
        <div class="field">
          <label for="c-desc">Description du tournoi</label>
          <textarea id="c-desc" name="description" maxlength="3000" placeholder="Présente ton tournoi : public visé, ambiance, prix, horaires de la journée..."></textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="c-start">Date et heure de début *</label>
            <input type="datetime-local" id="c-start" name="start_date" required>
          </div>
          <div class="field">
            <label for="c-end">Date et heure de fin</label>
            <input type="datetime-local" id="c-end" name="end_date">
          </div>
        </div>
        <div class="field">
          <label for="c-location">Lieu *</label>
          <input type="text" id="c-location" name="location" required maxlength="160" placeholder="Ex. : Gymnasium, École secondaire du Verger">
        </div>
        <div class="form-row">
          <div class="field">
            <label for="c-format">Format du tournoi *</label>
            <select id="c-format" name="format">
              <option value="suisse">Système suisse (tout le monde joue chaque ronde)</option>
              <option value="elimination">Élimination directe (pyramide, un seul gagnant)</option>
            </select>
          </div>
          <div class="field">
            <label for="c-rounds">Nombre de rondes (format suisse)</label>
            <input type="number" id="c-rounds" name="max_rounds" min="1" max="15" value="7">
          </div>
        </div>
        <label class="checkbox-line mb-2">
          <input type="checkbox" id="c-public" checked>
          <span>Tournoi public (visible par tous dans la liste des inscriptions). Décoche pour un tournoi privé où les joueurs sont ajoutés manuellement.</span>
        </label>
        <div class="field">
          <label for="c-rules">Règlements *</label>
          <textarea id="c-rules" name="rules" required maxlength="6000" style="min-height:150px;" placeholder="Cadence de jeu, matériel autorisé, pénalités, fair-play, tie-breaks... Les joueurs devront accepter ces règlements pour s'inscrire."></textarea>
        </div>
        <div class="alert alert-error" id="create-error" hidden></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Créer le tournoi</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("create-error");
      errBox.hidden = true;
      const v = formValues(e.target);
      if (!v.name || v.name.trim().length < 3) {
        errBox.textContent = "Donne un nom à ton tournoi (3 caractères minimum).";
        errBox.hidden = false;
        return;
      }
      if (!v.rules || v.rules.trim().length < 10) {
        errBox.textContent = "Écris des règlements clairs (10 caractères minimum) : les joueurs devront les accepter.";
        errBox.hidden = false;
        return;
      }
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "Création en cours...";
      try {
        const res = await api("/tournaments", {
          method: "POST",
          body: { ...v, max_rounds: v.max_rounds, public: document.getElementById("c-public").checked },
        });
        toast("Tournoi créé ! Tu es arbitre automatiquement.", "ok");
        setTimeout(() => (window.location.href = "panel-arbitres.html?tournoi=" + res.id), 700);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "Créer le tournoi";
      }
    });
  </script>
</body>
</html>
