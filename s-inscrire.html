<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S'inscrire · Tournechec</title>
  <meta name="description" content="Crée ton compte Tournechec : nom, courriel, mot de passe, année scolaire et Elo.">
  <link rel="icon" type="image/svg+xml" href="media/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/bottom.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body data-page="s-inscrire">
  <div id="site-header"></div>

  <main class="section-tight">
    <div class="container section-head center">
      <span class="kicker">Rejoins la communauté</span>
      <h1>Créer mon compte</h1>
      <p>Gratuit et rapide : moins d'une minute pour pouvoir t'inscrire aux tournois.</p>
    </div>

    <div class="container">
      <form id="register-form" class="card form-card" novalidate>
        <div class="field">
          <label for="r-name">Nom complet</label>
          <input type="text" id="r-name" name="name" required autocomplete="name" maxlength="80" placeholder="Ex. : Léa Tremblay">
        </div>
        <div class="field">
          <label for="r-email">Adresse courriel</label>
          <input type="email" id="r-email" name="email" required autocomplete="email" maxlength="120" placeholder="exemple@courriel.com">
        </div>
        <div class="form-row">
          <div class="field">
            <label for="r-password">Mot de passe</label>
            <input type="password" id="r-password" name="password" required minlength="8" autocomplete="new-password">
            <div class="hint">8 caractères minimum.</div>
          </div>
          <div class="field">
            <label for="r-password2">Confirmer le mot de passe</label>
            <input type="password" id="r-password2" name="password2" required minlength="8" autocomplete="new-password">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="r-year">Année scolaire</label>
            <select id="r-year" name="school_year">
              <option value="">— Choisir —</option>
              <option>1re secondaire</option>
              <option>2e secondaire</option>
              <option>3e secondaire</option>
              <option>4e secondaire</option>
              <option>5e secondaire</option>
              <option>Collégial / Cégep</option>
              <option>Universitaire</option>
              <option>Autre / Adulte</option>
            </select>
          </div>
          <div class="field">
            <label for="r-elo">Elo (classement)</label>
            <input type="number" id="r-elo" name="elo" min="0" max="3500" value="1200">
            <div class="hint">Laisse 1200 si tu ne le connais pas.</div>
          </div>
        </div>
        <input type="text" name="hp_website" value="" style="position:absolute;left:-9999px;" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="alert alert-error" id="register-error" hidden></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Créer mon compte</button>
        <p class="small muted text-center mt-2">Déjà inscrit ? <a href="se-connecter.html">Connecte-toi ici</a></p>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    const registerForm = document.getElementById("register-form");
    const pageLoadedAt = Date.now();

    api("/me").then((d) => {
      if (d.user) window.location.href = "interface-utilisateur.html";
    }).catch(() => {});

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("register-error");
      errBox.hidden = true;
      const v = formValues(registerForm);
      if (v.password !== v.password2) {
        errBox.textContent = "Les deux mots de passe ne correspondent pas.";
        errBox.hidden = false;
        return;
      }
      const btn = registerForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "Création du compte...";
      try {
        await api("/register", { method: "POST", body: { ...v, ts: pageLoadedAt } });
        toast("Compte créé ! Bienvenue sur Tournechec.", "ok");
        setTimeout(() => (window.location.href = "interface-utilisateur.html"), 700);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "Créer mon compte";
      }
    });
  </script>
</body>
</html>
