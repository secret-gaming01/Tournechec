<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem("tc_theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <title>Projecteur · Tournechec</title>
  <meta name="description" content="Affichage plein écran des tables, rondes et couleurs pour la salle de tournoi.">
  <link rel="icon" type="image/svg+xml" href="media/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body class="projector-mode" data-page="panel-projecteur">

  <div class="proj-head">
    <h1 id="proj-name">Chargement...</h1>
    <div id="proj-round"></div>
    <div id="proj-champion"></div>
  </div>

  <div class="proj-grid" id="proj-grid"></div>
  <p class="proj-meta" id="proj-meta">Actualisation automatique toutes les 15 secondes</p>

  <div class="proj-controls">
    <button class="btn btn-primary" id="fullscreen-btn">Plein écran (F11 ou clic)</button>
    <button class="btn btn-outline" style="background:#141d38;border-color:#27335c;color:#eef2ff;" onclick="window.close()">Fermer</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
  <script src="js/animations.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
    const tid = qsParam("tournoi");
    const RESULT_LABEL = { "1-0": "Les blancs ont gagné", "0-1": "Les noirs ont gagné", "1/2": "Partie nulle", bye: "Exempt (bye)" };

    if (!tid) {
      document.body.innerHTML = '<div style="padding:80px;text-align:center;color:#fff;font-family:sans-serif;"><h2>Tournoi non précisé</h2></div>';
      throw new Error("no tid");
    }

    function render(data) {
      const t = data.tournament;
      document.title = t.name + " · Projecteur · Tournechec";
      document.getElementById("proj-name").textContent = t.name;

      if (t.status === "termine" && t.champion) {
        document.getElementById("proj-round").innerHTML = "";
        document.getElementById("proj-champion").innerHTML =
          `<div class="proj-round">Champion : ${escapeHtml(t.champion)}</div>`;
      } else if (data.round > 0) {
        document.getElementById("proj-round").innerHTML = `Ronde ${data.round} — ${data.tables.length} table(s)`;
        document.getElementById("proj-champion").innerHTML = "";
      } else {
        document.getElementById("proj-round").innerHTML = "Tables en préparation...";
        document.getElementById("proj-champion").innerHTML = "";
      }

      const grid = document.getElementById("proj-grid");
      grid.innerHTML = data.tables.map((tb) => `
        <div class="proj-table">
          <div class="num">${tb.table_number}</div>
          <div class="proj-player"><span class="color-dot color-w"></span> ${tb.white ? escapeHtml(tb.white.name) : "<em>—</em>"} ${tb.white ? `<small>Elo ${tb.white.elo}</small>` : ""}</div>
          <div class="proj-vs">CONTRE</div>
          <div class="proj-player"><span class="color-dot color-b"></span> ${tb.black ? escapeHtml(tb.black.name) : "<em>Exempt</em>"} ${tb.black ? `<small>Elo ${tb.black.elo}</small>` : ""}</div>
          <div class="proj-res">${RESULT_LABEL[tb.result] || "&nbsp;"}</div>
        </div>`).join("");

      document.getElementById("proj-meta").innerHTML =
        `${data.participants} participant(s) · ${t.location ? escapeHtml(t.location) + " · " : ""}${t.start_date ? escapeHtml(t.start_date) : ""}`;
    }

    async function tick() {
      try {
        render(await api(`/tournaments/${tid}/projector`));
      } catch (err) {
        document.getElementById("proj-name").textContent = "Erreur de chargement";
        console.warn(err.message);
      }
    }

    document.getElementById("fullscreen-btn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch {}
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") document.getElementById("fullscreen-btn").click();
    });

    tick();
    setInterval(tick, 15000);
  </script>
</body>
</html>
