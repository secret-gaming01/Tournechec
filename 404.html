<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable · Tournechec</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/Tournechec/media/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:'Inter',Arial,sans-serif;background:#f4f6fc;color:#17223b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .box{text-align:center;max-width:460px;}
    .logo{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 30px rgba(23,34,59,.14);}
    .code{font-family:'Outfit',sans-serif;font-size:clamp(3.5rem,10vw,5.5rem);font-weight:800;margin:18px 0 4px;background:linear-gradient(120deg,#2f54eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;}
    h1{font-family:'Outfit',sans-serif;font-size:1.35rem;margin:0 0 10px;}
    p{color:#5a6478;line-height:1.6;margin:0 0 26px;}
    a.btn{display:inline-block;padding:13px 28px;border-radius:14px;text-decoration:none;font-weight:600;margin:0 6px 8px;}
    .primary{background:#2f54eb;color:#fff !important;box-shadow:0 8px 20px rgba(47,84,235,.3);}
    .ghost{border:1.5px solid #d5dbee;color:#17223b;}
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/Tournechec/media/images/logo.svg" alt="">
    <div class="code">404</div>
    <h1>Échec et mat... cette page n'existe pas !</h1>
    <p>Le lien est peut-être incorrect ou la page a été déplacée. Retourne à l'accueil pour retrouver tes tournois.</p>
    <a class="btn primary" href="/Tournechec/accueil.html">Retour à l'accueil</a>
    <a class="btn ghost" href="/Tournechec/aide.html">Page d'aide</a>
  </div>
</body>
</html>
